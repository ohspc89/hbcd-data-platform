[project]
name = "hbcd-data-platform"
version = "0.1.0"
description = "Local data engineering pipeline for BIDS-style wearable sensor metadata, quality control, and incremental IMU processing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
]

[project.scripts]
hbcd-data-platform = "hbcd_data_platform.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
